# Sveltia CMS — schémas du contenu de vjmvjmvjm.com
# Chaque collection correspond à un fichier (ou un dossier) de `content/`.
# Le build (tools/build-content.mjs) rend le Markdown : toute propriété `md` devient du HTML.

# TODO activation : créer le repo GitHub, brancher Netlify sur ce repo (build = npm run build),
# puis remplacer OWNER. D'ici là, Sveltia permet déjà d'éditer en local depuis Chrome
# (« Work with Local Repository ») sur http://localhost.
backend:
  name: github
  repo: OWNER/wania
  branch: main

locale: fr
media_folder: assets/uploads
public_folder: assets/uploads

collections:
  - name: lecture
    label: Coin lecture
    label_singular: texte
    folder: content/lecture
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: titre
    summary: "{{titre}}"
    sortable_fields: [ordre, titre]
    fields:
      - { name: titre, label: Titre, widget: string }
      - { name: surtitre, label: "Surtitre (ex. Chapitre XII)", widget: string, required: false }
      - { name: publie, label: Publié, widget: boolean, default: true }
      - { name: ordre, label: "Ordre dans le collage", widget: number, value_type: int, default: 1 }
      - { name: contexte, label: "Contexte (date, lieu, source…)", widget: string, required: false }
      - { name: contextePosition, label: "Position du contexte", widget: select, options: [haut, bas], default: haut }
      - name: vignette
        label: Vignette du collage
        widget: object
        fields:
          - { name: type, label: "Afficher", widget: select, options: [titre, extrait, image], default: titre }
          - { name: extrait, label: Extrait, widget: text, required: false }
          - { name: image, label: Image, widget: image, required: false }
      # Définition des blocs partagés (texte, image, vidéo, audio, lien), réutilisée plus bas
      # par les infos d'album, les news, la bio et les résumés Kinematik.
      - &blocks
        name: blocks
        label: Contenu
        label_singular: bloc
        widget: list
        typeKey: type
        types:
          - name: text
            label: Texte
            widget: object
            fields:
              - { name: md, label: "Texte (Markdown, [^1] = appel de note)", widget: markdown }
              - { name: variante, label: "Variante", widget: select, options: ["", "liste"], required: false }
          - name: image
            label: Image
            widget: object
            fields:
              - { name: src, label: Image, widget: image }
              - { name: alt, label: "Description (accessibilité)", widget: string, required: false }
              - { name: legende, label: Légende, widget: string, required: false }
          - name: video
            label: Vidéo
            widget: object
            fields:
              - { name: vimeoId, label: "Identifiant Vimeo", widget: string, required: false }
              - { name: url, label: "…ou fichier / URL vidéo", widget: file, required: false }
              - { name: legende, label: Légende, widget: string, required: false }
          - name: audio
            label: Audio
            widget: object
            fields:
              - { name: src, label: "Fichier audio", widget: file }
              - { name: titre, label: Titre, widget: string, required: false }
          - name: lien
            label: Lien
            widget: object
            fields:
              - { name: label, label: Texte, widget: string }
              - { name: url, label: URL, widget: string }
      - name: notes
        label: Notes de bas de page
        label_singular: note
        widget: list
        required: false
        fields:
          - { name: md, label: "Note (la 1re répond à [^1], etc.)", widget: markdown }

  - name: pages
    label: Réglages et sections
    files:
      - name: site
        label: Réglages du site
        file: content/site.json
        format: json
        fields:
          - { name: email, label: Email, widget: string }
          - { name: iban, label: IBAN, widget: string }
          - { name: bioOeilVisible, label: "Afficher l'œil de la bio", widget: boolean, default: true }
          - { name: policeMenu, label: "Police des titres du menu (Google Fonts)", widget: select, options: ["Open Sans", "Manrope", "Work Sans", "IBM Plex Sans", "Space Grotesk"], default: "Open Sans" }
          - name: social
            label: Réseaux
            widget: list
            fields:
              - { name: id, label: Réseau, widget: select, options: [instagram, facebook, vimeo, spotify] }
              - { name: label, label: Libellé, widget: string }
              - { name: url, label: URL, widget: string }

      - name: news
        label: News
        file: content/news.json
        format: json
        fields:
          - name: news
            label: Événements
            label_singular: événement
            widget: list
            summary: "{{titre}} ({{debut}} → {{fin}})"
            fields:
              - { name: id, label: Identifiant, widget: string }
              - { name: actif, label: Actif, widget: boolean, default: true }
              - { name: titre, label: "Titre (affiché sous le nom)", widget: string }
              - { name: debut, label: "Affiché à partir du", widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
              - { name: fin, label: "Jusqu'au (inclus)", widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
              - { name: mode, label: "Au clic", widget: select, options: [{ label: "Pop-up", value: popup }, { label: "Lien externe", value: lien }], default: popup }
              - { name: url, label: "URL (mode lien)", widget: string, required: false }
              - { <<: *blocks, name: blocks, label: "Contenu (mode pop-up)", required: false }

      - name: bio
        label: Bio
        file: content/bio.json
        format: json
        fields:
          - name: fr
            label: Français
            widget: object
            fields:
              - { <<: *blocks, name: pro, label: "Bio (page)" }
              - { <<: *blocks, name: perso, label: "Texte derrière l'œil" }
          - name: en
            label: English
            widget: object
            fields:
              - { name: aValider, label: "Traduction à valider", widget: boolean, default: false }
              - { <<: *blocks, name: pro, label: "Bio (page)" }
              - { <<: *blocks, name: perso, label: "Texte derrière l'œil" }

      - name: kinematik
        label: Kinematik
        file: content/kinematik.json
        format: json
        fields:
          - name: films
            label: Films
            label_singular: film
            widget: list
            summary: "{{titre}} {{sousTitre}} ({{annee}})"
            fields:
              - { name: id, label: "Identifiant (nom de la vignette assets/kinematik/ID.jpg)", widget: string }
              - { name: titre, label: Titre, widget: string }
              - { name: sousTitre, label: Sous-titre, widget: string, required: false }
              - { name: duree, label: "Durée (ex. 2'11\")", widget: string }
              - { name: annee, label: Année, widget: number, value_type: int }
              - { name: vimeoId, label: "Identifiant Vimeo", widget: string }
              - { name: hash, label: "Hash Vimeo (vidéo privée)", widget: string, required: false }
              - { name: trailer, label: Trailer, widget: boolean, default: false }
              - { name: mention, label: "Mention exceptionnelle sur la vignette", widget: string, required: false }
              - { <<: *blocks, name: resume, label: "Résumé (derrière le « i »)", required: false }
              - name: generique
                label: Générique
                widget: list
                required: false
                fields:
                  - { name: role, label: Rôle, widget: string }
                  - { name: noms, label: Noms, widget: string }

      - name: albums
        label: Films pour les oreilles
        file: content/albums.json
        format: json
        fields:
          - name: albums
            label: Albums
            label_singular: album
            widget: list
            summary: "{{titre}}"
            fields:
              - { name: id, label: Identifiant, widget: string }
              - { name: titre, label: Titre, widget: string }
              - { <<: *blocks, name: infos, label: "Infos (derrière le « i »)" }
              - { name: spotify, label: "Lecteur Spotify (si pas d'épisodes)", widget: string, required: false }
              - name: episodes
                label: Épisodes
                widget: list
                required: false
                fields:
                  - { name: id, label: Numéro, widget: number, value_type: int }
                  - { name: title, label: Titre, widget: string }
                  - { name: duration, label: "Durée (mm:ss)", widget: string }
                  - { name: sec, label: "Durée en secondes", widget: number, value_type: int }
                  - { name: src, label: "Fichier MP3", widget: file }
