# Sveltia CMS — schémas du contenu de vjmvjmvjm.com
# Chaque collection correspond à un fichier (ou un dossier) de `content/`.
# Le build (tools/build-content.mjs) rend le Markdown : toute propriété `md`, `corps` ou
# `contenu` devient du HTML, et les URL de playlist deviennent des lecteurs intégrés.

# Chaque enregistrement crée un commit sur `main` ; Netlify reconstruit le site dans la minute.
# Les images déposées vont dans assets/uploads/ : le build en tire dimensions et vignettes
# (tools/build-images.mjs), une photo de téléphone peut donc être déposée telle quelle.
backend:
  name: github
  repo: jonathanvouilloz/vjmvjmvjm
  branch: main

media_folder: assets/uploads
public_folder: assets/uploads

collections:
  - name: lecture
    label: Coin lecture
    label_singular: texte
    folder: content/lecture
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: titre
    summary: "{{titre}}"
    sortable_fields: [ordre, titre]
    fields:
      - { name: titre, label: Titre, widget: string }
      - { name: surtitre, label: "Surtitre (ex. Chapitre XII)", widget: string, required: false }
      - { name: publie, label: Publié, widget: boolean, default: true }
      - { name: ordre, label: "Ordre dans le collage", widget: number, value_type: int, default: 1 }
      - { name: contexte, label: "Contexte (date, lieu, source…)", widget: string, required: false }
      - { name: contextePosition, label: "Position du contexte", widget: select, options: [haut, bas], default: haut }
      - name: vignette
        label: Vignette du collage
        widget: object
        fields:
          - { name: type, label: Afficher, widget: select, options: [{ label: "Le titre", value: titre }, { label: "Un extrait", value: extrait }, { label: "Une image", value: image }], default: titre }
          - { name: extrait, label: "Extrait (300 caractères max)", widget: text, required: false, maxlength: 300 }
          - { name: image, label: "Image (si « Une image »)", widget: image, required: false }
      - name: corps
        label: Texte
        widget: markdown
        modes: [rich_text, raw]
        hint: "[^1] = appel de la 1re note. Pour une vidéo, coller l'adresse Vimeo ou YouTube seule sur sa ligne."
      - name: notes
        label: Notes de bas de page
        label_singular: note
        widget: list
        required: false
        fields:
          - { name: md, label: "Note (la 1re répond à [^1], etc.)", widget: markdown }

  - name: pages
    label: Réglages et sections
    files:
      - name: site
        label: Réglages du site
        file: content/site.json
        format: json
        fields:
          - { name: email, label: Email, widget: string }
          - { name: iban, label: IBAN, widget: string }
          - { name: description, label: "Description pour Google et les partages (une phrase)", widget: text, maxlength: 200 }
          - { name: bioOeilVisible, label: "Afficher l'œil de la bio", widget: boolean, default: true }
          - { name: policeMenu, label: "Police des titres du menu (Google Fonts)", widget: select, options: ["Open Sans", "Manrope", "Work Sans", "IBM Plex Sans", "Space Grotesk"], default: "Open Sans" }
          - name: social
            label: Réseaux
            widget: list
            fields:
              - { name: id, label: Réseau, widget: select, options: [instagram, facebook, vimeo, spotify] }
              - { name: label, label: Libellé, widget: string }
              - { name: url, label: URL, widget: string }

      - name: news
        label: News
        file: content/news.json
        format: json
        fields:
          - name: news
            label: Événements
            label_singular: événement
            widget: list
            summary: "{{titre}} ({{debut}} → {{fin}})"
            fields:
              - { name: id, label: Identifiant, widget: string }
              - { name: actif, label: Actif, widget: boolean, default: true }
              - { name: titre, label: "Titre (affiché sous le nom)", widget: string }
              - { name: debut, label: "Affiché à partir du", widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
              - { name: fin, label: "Jusqu'au (inclus)", widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
              - { name: mode, label: "Au clic", widget: select, options: [{ label: "Pop-up", value: popup }, { label: "Lien externe", value: lien }], default: popup }
              - { name: url, label: "URL (mode lien)", widget: string, required: false }
              # Définition des blocs partagés (texte, image, vidéo, audio, lien), réutilisée
              # plus bas par la bio et les résumés Kinematik.
              - &blocks
                name: blocks
                label: "Contenu (mode pop-up)"
                label_singular: bloc
                widget: list
                required: false
                typeKey: type
                types:
                  - name: text
                    label: Texte
                    widget: object
                    fields:
                      - { name: md, label: "Texte (Markdown)", widget: markdown }
                      - { name: variante, label: Variante, widget: select, options: ["", "liste"], required: false }
                  - name: image
                    label: Image
                    widget: object
                    fields:
                      - { name: src, label: Image, widget: image }
                      - { name: alt, label: "Description (accessibilité)", widget: string, required: false }
                      - { name: legende, label: Légende, widget: string, required: false }
                  - name: video
                    label: Vidéo
                    widget: object
                    fields:
                      - { name: vimeoId, label: "Identifiant Vimeo", widget: string, required: false }
                      - { name: url, label: "…ou fichier / URL vidéo", widget: file, required: false }
                      - { name: legende, label: Légende, widget: string, required: false }
                  - name: audio
                    label: Audio
                    widget: object
                    fields:
                      - { name: src, label: "Fichier audio", widget: file }
                      - { name: titre, label: Titre, widget: string, required: false }
                  - name: lien
                    label: Lien
                    widget: object
                    fields:
                      - { name: label, label: Texte, widget: string }
                      - { name: url, label: URL, widget: string }

      - name: bio
        label: Bio
        file: content/bio.json
        format: json
        fields:
          - name: fr
            label: Français
            widget: object
            fields:
              - { <<: *blocks, name: pro, label: "Bio (page)", required: true }
              - { <<: *blocks, name: perso, label: "Texte derrière l'œil", required: true }
          - name: en
            label: English
            widget: object
            fields:
              - { name: aValider, label: "Traduction à valider", widget: boolean, default: false }
              - { <<: *blocks, name: pro, label: "Bio (page)", required: true }
              - { <<: *blocks, name: perso, label: "Texte derrière l'œil", required: true }
          - name: portraits
            label: "Autoportraits (un au hasard à chaque visite)"
            label_singular: portrait
            widget: list
            field: { name: image, label: Image, widget: image }

      - name: accueil
        label: Accueil
        file: content/accueil.json
        format: json
        fields:
          - name: photos
            label: "Photos (une au hasard à l'ouverture ; elles rejoignent aussi le collage des carnets)"
            label_singular: photo
            widget: list
            hint: "Seules les photos en paysage passent en fond d'accueil ; les autres restent dans le collage."
            field: { name: image, label: Photo, widget: image }

      - name: carnets
        label: Carnets de voyages
        file: content/carnets.json
        format: json
        fields:
          - name: carnets
            label: Pages
            label_singular: page
            widget: list
            summary: "{{titre}}"
            fields:
              - { name: image, label: Image, widget: image }
              - { name: titre, label: "Titre (facultatif)", widget: string, required: false }

      - name: aleas
        label: Aléas du jour
        file: content/aleas.json
        format: json
        fields:
          - name: aleas
            label: Phrases manuscrites
            label_singular: phrase
            widget: list
            hint: "PNG à fond transparent : l'encre noire s'inverse en blanc dans le thème sombre."
            field: { name: image, label: Image, widget: image }

      - name: kinematik
        label: Kinematik
        file: content/kinematik.json
        format: json
        fields:
          - name: films
            label: Films
            label_singular: film
            widget: list
            summary: "{{titre}} {{sousTitre}} ({{annee}})"
            fields:
              - { name: id, label: "Identifiant (unique, ex. k13)", widget: string }
              - { name: titre, label: Titre, widget: string }
              - { name: vignette, label: "Image de la vignette", widget: image, required: false }
              - { name: sousTitre, label: Sous-titre, widget: string, required: false }
              - { name: duree, label: "Durée (ex. 2'11\")", widget: string }
              - { name: annee, label: Année, widget: number, value_type: int }
              - { name: vimeoId, label: "Identifiant Vimeo", widget: string }
              - { name: hash, label: "Hash Vimeo (vidéo privée)", widget: string, required: false }
              - { name: trailer, label: Trailer, widget: boolean, default: false }
              - { name: mention, label: "Mention exceptionnelle sur la vignette", widget: string, required: false }
              - { name: information, label: "Information (le « i » de la vignette, 300 caractères max)", widget: text, required: false, maxlength: 300 }
              - { <<: *blocks, name: resume, label: "Résumé (derrière le « i » de la lecture vidéo)" }
              - name: generique
                label: Générique
                widget: list
                required: false
                fields:
                  - { name: role, label: Rôle, widget: string }
                  - { name: noms, label: Noms, widget: string }

      - name: albums
        label: Films pour les oreilles
        file: content/albums.json
        format: json
        fields:
          - name: albums
            label: Albums
            label_singular: album
            widget: list
            summary: "{{titre}}"
            fields:
              - { name: id, label: Identifiant, widget: string }
              - { name: titre, label: Titre, widget: string }
              - { name: resume, label: "Résumé (derrière le « i », 300 caractères max)", widget: text, required: false, maxlength: 300 }
              - name: playlists
                label: Playlists
                label_singular: playlist
                widget: list
                required: false
                summary: "{{plateforme}} · {{langue}}"
                hint: "Spotify, Apple, Deezer, YouTube et SoundCloud s'affichent en lecteur ; les autres en lien."
                fields:
                  - name: plateforme
                    label: Plateforme
                    widget: select
                    options:
                      - { label: Spotify, value: spotify }
                      - { label: Apple Music, value: apple-music }
                      - { label: Apple Podcasts, value: apple-podcasts }
                      - { label: Deezer, value: deezer }
                      - { label: YouTube, value: youtube }
                      - { label: SoundCloud, value: soundcloud }
                      - { label: Bandcamp, value: bandcamp }
                      - { label: Amazon Music, value: amazon-music }
                      - { label: Autre, value: autre }
                  - { name: libelle, label: "Nom de la plateforme (si « Autre »)", widget: string, required: false }
                  - name: langue
                    label: Langue
                    widget: select
                    default: fr
                    options:
                      - { label: Français, value: fr }
                      - { label: English, value: en }
                      - { label: Español, value: es }
                      - { label: Deutsch, value: de }
                      - { label: Italiano, value: it }
                      - { label: Português, value: pt }
                  - { name: url, label: "URL de la playlist", widget: string }
              - name: contenu
                label: "Texte de la page"
                widget: markdown
                required: false
                modes: [rich_text, raw]
                hint: "Pour une vidéo, coller l'adresse Vimeo ou YouTube seule sur sa ligne."
              - name: episodes
                label: Épisodes (lecteur du site)
                widget: list
                required: false
                fields:
                  - { name: id, label: Numéro, widget: number, value_type: int }
                  - { name: title, label: Titre, widget: string }
                  - { name: duration, label: "Durée (mm:ss)", widget: string }
                  - { name: sec, label: "Durée en secondes", widget: number, value_type: int }
                  - { name: src, label: "Fichier MP3", widget: file }
