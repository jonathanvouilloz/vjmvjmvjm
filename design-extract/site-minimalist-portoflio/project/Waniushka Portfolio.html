<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vania Jaikin Miyazaki</title>
  <meta name="description" content="Vania Jaikin Miyazaki (VJM) — réalisatrice et productrice de films et de créations sonores, artiste et curatrice à Genève.">
  <meta name="author" content="Vania Jaikin Miyazaki">
  <link rel="canonical" href="https://vjmvjmvjm.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Vania Jaikin Miyazaki">
  <meta property="og:description" content="Réalisatrice et productrice de films et de créations sonores, artiste et curatrice.">
  <meta property="og:site_name" content="Vania Jaikin Miyazaki">
  <meta property="og:locale" content="fr_CH">
  <meta property="og:url" content="https://vjmvjmvjm.com/">
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/brand/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <!-- Le site est rendu en JS : ces données structurées disent à Google, sans exécuter la
       page, que vjmvjmvjm.com est le site de Vania Jaikin Miyazaki. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Vania Jaikin Miyazaki",
    "alternateName": ["VJM", "Waniushka"],
    "url": "https://vjmvjmvjm.com/",
    "jobTitle": "Réalisatrice, productrice, artiste et curatrice",
    "homeLocation": { "@type": "Place", "name": "Genève" },
    "sameAs": [
      "https://www.instagram.com/waniushka",
      "https://www.facebook.com/waniouchka",
      "https://vimeo.com/waniouchka",
      "https://open.spotify.com/show/4qmj0UuzPkLPpDFqxgd2MY"
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..600&family=Manrope:wght@300..600&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* Plus aucune police manuscrite n'est chargée.
       Learning Curve (aléas du jour) et Arsenale White (intro de la Bio) étaient toutes deux
       sous licence non commerciale et bloquaient la mise en ligne. Le manuscrit vient
       désormais des scans de Vania elle-même : les aléas sont des PNG détourés
       (tools/cutout-drawing.py) et la bio est passée en Newsreader, à sa demande — les
       polices « à la main » décourageaient la lecture. Les fichiers restent dans
       assets/fonts/ pour l'archive mais ne partent pas en prod (voir precompile.mjs). */

    :root {
      --bg: #FAFAF8;
      /* voile semi-transparent (aléas du jour) : laisse passer le flou d'arrière-plan */
      --bg-veil: rgba(250, 250, 248, 0.86);
      --fg: #1A1A1A;
      --fg-muted: #8A8A8A;
      --fg-subtle: #C8C8C8;
      --border: rgba(0,0,0,0.07);
      /* Les dessins scannés (nom manuscrit, sigles) sont de l'encre noire sur fond
         transparent : en thème sombre on les inverse plutôt que de doubler les fichiers. */
      --ink-invert: none;
      /* 2 familles : serif Newsreader (titres + corps)
         · Manrope (sections « digitales », chiffres, UI) */
      --font-heading: 'Newsreader', Georgia, serif;
      --font-body: 'Newsreader', Georgia, serif;
      --font-digital: 'Manrope', sans-serif;
      /* titres du menu — la famille vient de content/site.json (policeMenu) */
      --font-menu: 'Open Sans', sans-serif;
      --heading-weight: 400;
      --heading-spacing: 0.02em;
      --nav-transform: none;
      --nav-spacing: 0.06em;
      --nav-size: 14px;

      /* Layout : container de base, en-tête, rythme vertical */
      --container-max: 1440px;
      --container-pad: clamp(24px, 5vw, 72px);
      --header-h: 78px;
      --page-top: calc(var(--header-h) + clamp(40px, 6vh, 80px));
      --page-bottom: clamp(80px, 10vh, 140px);
      --block-gap: clamp(32px, 4vw, 56px);
    }

    [data-theme="dark"] {
      --bg: #0A0A0A;
      --bg-veil: rgba(10, 10, 10, 0.86);
      --fg: #E8E8E6;
      --fg-muted: #6E6E6E;
      --fg-subtle: #2A2A2A;
      --border: rgba(255,255,255,0.07);
      --ink-invert: invert(1);
    }

    html {
      background: var(--bg);
      color: var(--fg);
      transition: background 0.5s ease, color 0.5s ease;
    }

    body {
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    ::selection {
      background: var(--fg);
      color: var(--bg);
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--fg-muted); border-radius: 2px; }

    button { font-family: inherit; }
    a { color: inherit; }

    /* ── Contenu éditable (content/ → Markdown rendu au build) ── */
    .vjm-prose { font-family: var(--font-body); line-height: 1.7; }
    .vjm-prose p { margin-bottom: 1.05em; }
    .vjm-prose > :last-child > :last-child { margin-bottom: 0; }
    .vjm-prose a { color: inherit; text-decoration: underline; text-decoration-color: var(--fg-subtle); text-underline-offset: 0.18em; transition: text-decoration-color 0.25s; }
    .vjm-prose a:hover { text-decoration-color: currentColor; }
    .vjm-prose em { font-style: italic; }
    .vjm-prose strong { font-weight: 600; }
    .vjm-prose ul, .vjm-prose ol { margin: 0 0 1.05em 1.2em; }
    .vjm-prose blockquote { margin: 1.4em 0; padding-left: 1.2em; border-left: 1px solid var(--fg-subtle); font-style: italic; }
    .vjm-prose figure { margin: 2em 0; }
    .vjm-prose figure img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
    .vjm-prose img { max-width: 100%; height: auto; }
    .vjm-prose .vjm-video iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; }
    .vjm-prose figcaption, .vjm-prose .vjm-audio-title { margin-top: 8px; font-size: 0.82em; color: var(--fg-muted); text-align: center; }
    .vjm-prose .vjm-audio-title { margin: 0 0 8px; text-align: left; }
    .vjm-prose .vjm-liste p { margin-bottom: 0.35em; font-size: 0.92em; }
    .vjm-prose .vjm-liste { margin-bottom: 1.05em; }
    .vjm-prose-small { font-size: 15px; line-height: 1.65; }
    .fn-ref { font-size: 0.6em; line-height: 0; margin-left: 1px; font-family: var(--font-digital); }
    .fn-ref a { text-decoration: none !important; padding: 0 2px; }
    /* notes discrètes : un cran sous le texte, interligne resserré */
    .vjm-notes { margin-top: 3em; padding-top: 1.2em; border-top: 1px solid var(--border); font-size: 0.72em; line-height: 1.55; color: var(--fg-muted); }
    .vjm-notes li { margin-bottom: 0.6em; list-style: none; display: flex; gap: 8px; }
    .vjm-notes p { margin-bottom: 0.4em; }
    [id^="note-"], [id^="ref-"] { scroll-margin-top: calc(var(--header-h) + 24px); }
    .vjm-scroll { scrollbar-width: thin; }
    .vjm-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Copie statique requise pour que le post-traitement Netlify détecte le formulaire
       rendu côté client par React. Les noms de champs doivent rester alignés avec ContactPage. -->
  <form name="contact" method="POST" enctype="multipart/form-data" data-netlify="true"
    data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input type="hidden" name="subject" value="Nouveau message depuis vjmvjmvjm.com">
    <input type="text" name="bot-field">
    <input type="text" name="nom">
    <input type="email" name="email">
    <textarea name="message"></textarea>
    <input type="file" name="dessin" accept="image/png">
  </form>
  <!-- Texte lisible sans JavaScript (moteurs de recherche, lecteurs d'écran avant montage).
       React remplace le contenu de #root au démarrage. -->
  <div id="root">
    <main class="vjm-sr">
      <h1>Vania Jaikin Miyazaki</h1>
      <p>Vania Jaikin Miyazaki (VJM) est réalisatrice et productrice de films et de créations sonores, artiste et curatrice, à Genève. Kinematik, films pour les oreilles, carnets de voyage et coin lecture.</p>
    </main>
  </div>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="waniushka-components.jsx"></script>
  <script type="text/babel" src="waniushka-app.jsx"></script>
</body>
</html>
