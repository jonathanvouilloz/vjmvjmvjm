<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vania Jaikin Miyazaki</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..600&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* Plus aucune police manuscrite n'est chargée.
       Learning Curve (aléas du jour) et Arsenale White (intro de la Bio) étaient toutes deux
       sous licence non commerciale et bloquaient la mise en ligne. Le manuscrit vient
       désormais des scans de Vania elle-même : les aléas sont des PNG détourés
       (tools/cutout-drawing.py) et la bio est passée en Newsreader, à sa demande — les
       polices « à la main » décourageaient la lecture. Les fichiers restent dans
       assets/fonts/ pour l'archive mais ne partent pas en prod (voir precompile.mjs). */

    :root {
      --bg: #FAFAF8;
      /* voile semi-transparent (aléas du jour) : laisse passer le flou d'arrière-plan */
      --bg-veil: rgba(250, 250, 248, 0.86);
      --fg: #1A1A1A;
      --fg-muted: #8A8A8A;
      --fg-subtle: #C8C8C8;
      --border: rgba(0,0,0,0.07);
      /* Les dessins scannés (nom manuscrit, sigles) sont de l'encre noire sur fond
         transparent : en thème sombre on les inverse plutôt que de doubler les fichiers. */
      --ink-invert: none;
      /* 2 familles : serif Newsreader (titres + corps)
         · Manrope (sections « digitales », chiffres, UI) */
      --font-heading: 'Newsreader', Georgia, serif;
      --font-body: 'Newsreader', Georgia, serif;
      --font-digital: 'Manrope', sans-serif;
      --heading-weight: 400;
      --heading-spacing: 0.02em;
      --nav-transform: none;
      --nav-spacing: 0.06em;
      --nav-size: 14px;

      /* Layout : container de base, en-tête, rythme vertical */
      --container-max: 1440px;
      --container-pad: clamp(24px, 5vw, 72px);
      --header-h: 78px;
      --page-top: calc(var(--header-h) + clamp(40px, 6vh, 80px));
      --page-bottom: clamp(80px, 10vh, 140px);
      --block-gap: clamp(32px, 4vw, 56px);
    }

    [data-theme="dark"] {
      --bg: #0A0A0A;
      --bg-veil: rgba(10, 10, 10, 0.86);
      --fg: #E8E8E6;
      --fg-muted: #6E6E6E;
      --fg-subtle: #2A2A2A;
      --border: rgba(255,255,255,0.07);
      --ink-invert: invert(1);
    }

    html {
      background: var(--bg);
      color: var(--fg);
      transition: background 0.5s ease, color 0.5s ease;
    }

    body {
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    ::selection {
      background: var(--fg);
      color: var(--bg);
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--fg-muted); border-radius: 2px; }

    button { font-family: inherit; }
    a { color: inherit; }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="waniushka-components.jsx"></script>
  <script type="text/babel" src="waniushka-app.jsx"></script>
</body>
</html>
